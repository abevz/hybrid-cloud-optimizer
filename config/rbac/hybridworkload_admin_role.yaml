# This rule is not used by the project hybrid-cloud-optimizer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cost.hybrid.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hybrid-cloud-optimizer
    app.kubernetes.io/managed-by: kustomize
  name: hybridworkload-admin-role
rules:
- apiGroups:
  - cost.hybrid.io
  resources:
  - hybridworkloads
  verbs:
  - '*'
- apiGroups:
  - cost.hybrid.io
  resources:
  - hybridworkloads/status
  verbs:
  - get
